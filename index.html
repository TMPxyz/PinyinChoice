<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拼音学习游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部状态栏 -->
    <header id="header">
      <div id="hp-display">
        <span id="hp-hearts"></span>
      </div>
      <div id="score-display">
        <span class="score-label">Score</span>
        <span id="score-value">0</span>
      </div>
      <div id="best-display">
        <span class="score-label">Best</span>
        <span id="best-value">0</span>
      </div>
      <button id="bgm-toggle" title="切换背景音乐">🔊</button>
    </header>

    <!-- 加载提示 -->
    <div id="loading">
      <p>加载数据中...</p>
    </div>

    <!-- 游戏主区域 -->
    <main id="game-area" style="display:none;">
      <div id="question-area">
        <p id="question-text"></p>
      </div>
      <div id="options-area">
        <button class="option-btn" data-index="0"></button>
        <button class="option-btn" data-index="1"></button>
        <button class="option-btn" data-index="2"></button>
        <button class="option-btn" data-index="3"></button>
      </div>
    </main>

    <!-- Game Over 界面 -->
    <div id="game-over" style="display:none;">
      <h1>Game Over</h1>
      <p id="final-score"></p>
      <p id="final-best"></p>
      <button id="restart-btn">Restart</button>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
